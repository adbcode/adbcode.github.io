name: Hugo GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: hugo-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Update the matching SHA-256 checksum when changing either version.
  HUGO_VERSION: '0.168.0'
  HUGO_SHA256: fada83ad56bb27ed4cb7dd81590303bdac16140f944ac4e66fc248117e2d5594
  DART_SASS_VERSION: '1.106.1'
  DART_SASS_SHA256: ad99cccb90de4ad2926e03e32d819c83baf32c3dbff56da92df0eed10e604d60
  TZ: Europe/Paris

jobs:
  build:
    name: Build Hugo site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pull requests can build before Pages is enabled, including from forks.
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install Hugo and Dart Sass
        run: |
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          curl --fail --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "$RUNNER_TEMP/hugo.tar.gz"
          echo "$HUGO_SHA256  $RUNNER_TEMP/hugo.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

          curl --fail --location --retry 3 \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/dart-sass.tar.gz"
          echo "$DART_SASS_SHA256  $RUNNER_TEMP/dart-sass.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/dart-sass.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          hugo version
          sass --version
          echo "Draft posts (excluded from this deployment):"
          hugo list drafts
          echo "Future posts (excluded until their publication date and a new build):"
          hugo list future
          args=(--gc --minify --panicOnWarning)
          if [[ -n "$BASE_URL" ]]; then
            args+=(--baseURL "${BASE_URL%/}/")
          fi
          hugo build "${args[@]}"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
